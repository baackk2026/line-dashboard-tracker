<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Access</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 90%;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 18px; font-weight: 600; color: #1a202c; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #718096; }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    .error-title { font-size: 18px; font-weight: 600; color: #e53e3e; margin-bottom: 8px; }
    .error-msg { font-size: 14px; color: #718096; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card" id="app">
  <div class="spinner"></div>
  <div class="title">กำลังโหลด...</div>
  <div class="subtitle">กรุณารอสักครู่</div>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
var LIFF_ID = "2011130854-3vn9oGZQ";
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLJiU0vuYhqXdQTAatMVtsMI_z5g1m-jytaHXJHufNCnQYPU3MtMsRwDVN7KnstyCM/exec";

var DASHBOARDS = {
  "kpi": {
    name: "KPI",
    url: "https://datastudio.google.com/reporting/267b8d13-b09b-4d3e-8d5d-1089a7490c92"
  },
  "4dx": {
    name: "4DX",
    url: "https://datastudio.google.com/reporting/bf194476-1d20-4e31-add1-44ebf016ce47"
  },
  "performance": {
    name: "ผลประกอบการ",
    url: "https://datastudio.google.com/reporting/aa30f2be-8458-4d13-baa8-a9f4055ac7b6"
  }
};

// ============================================================
// HELPERS
// ============================================================
function showLoading(msg) {
  document.getElementById("app").innerHTML =
    '<div class="spinner"></div>' +
    '<div class="title">' + msg + '</div>' +
    '<div class="subtitle">กรุณารอสักครู่</div>';
}

function showError(title, msg) {
  document.getElementById("app").innerHTML =
    '<div class="error-icon">&#9888;</div>' +
    '<div class="error-title">' + title + '</div>' +
    '<div class="error-msg">' + msg + '</div>';
}

function getDashboardId() {
  var p = new URLSearchParams(window.location.search);
  var direct = p.get("dashboard");
  if (direct) return direct;
  var liffState = p.get("liff.state");
  if (liffState) {
    try {
      var decoded = decodeURIComponent(liffState);
      var s = decoded.charAt(0) === "?" ? decoded.slice(1) : decoded;
      var fromState = new URLSearchParams(s).get("dashboard");
      if (fromState) return fromState;
    } catch(e) {}
  }
  return sessionStorage.getItem("pending_dashboard");
}

function sendLog(userId, dashboardId) {
  var logUrl = APPS_SCRIPT_URL +
    "?userId=" + encodeURIComponent(userId) +
    "&dashboardId=" + encodeURIComponent(dashboardId) +
    "&t=" + Date.now();

  // keepalive ทำให้ request ส่งได้แม้จะ redirect ไปแล้ว
  try {
    fetch(logUrl, { mode: "no-cors", keepalive: true });
  } catch(e) {
    new Image().src = logUrl;
  }
}

// ============================================================
// MAIN
// ============================================================
async function main() {
  try {
    showLoading("กำลังโหลด...");

    var earlyId = getDashboardId();
    if (earlyId) sessionStorage.setItem("pending_dashboard", earlyId);

    await liff.init({ liffId: LIFF_ID });

    var dashboardId = getDashboardId();

    if (!dashboardId || !DASHBOARDS[dashboardId]) {
      showError("ไม่พบข้อมูล Dashboard", "กรุณาเข้าผ่าน Rich Menu ของ LINE เท่านั้น");
      return;
    }

    if (!liff.isLoggedIn()) {
      var base = window.location.origin + window.location.pathname;
      liff.login({ redirectUri: base + "?dashboard=" + dashboardId });
      return;
    }

    showLoading("กำลังเข้าสู่ " + DASHBOARDS[dashboardId].name + "...");

    var profile = await liff.getProfile();
    var userId = profile.userId;

    sessionStorage.removeItem("pending_dashboard");

    // ส่ง log (fire & forget ผ่าน image pixel)
    sendLog(userId, dashboardId);

    // Redirect ไป Looker โดยตรง ไม่ผ่าน Apps Script
    window.location.href = DASHBOARDS[dashboardId].url;

  } catch(err) {
    console.error(err);
    showError("เกิดข้อผิดพลาด", "กรุณาปิดแล้วเปิดใหม่อีกครั้ง");
  }
}
  

main();
</script>
</body>
</html>
